<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="referrer" content="no-referrer">
  <title>Account erstellen · movienight</title>
  <link rel="icon" href="/frontend/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/frontend/fonts/inter.css">
  <link rel="stylesheet" href="/frontend/css/base.css">
</head>
<body>
  <div class="auth-poster-strip" aria-hidden="true"></div>
  <main class="auth">
    <div class="auth-card">
      <span class="logo"><span class="logo-mark"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#ticket"/></svg></span><span>movie<b>night</b></span></span>
      <h1 class="auth-title">Du bist eingeladen</h1>
      <p class="auth-sub">Leg dir einen Account an, schlag Filme vor und stimm mit ab.</p>

      <div class="alert" id="msg" role="alert" hidden></div>

      <form id="registerForm" novalidate>
        <div class="alert alert-ok" id="tokenOk" hidden>
          <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#check"/></svg>
          <span>Einladung erkannt</span>
        </div>
        <div class="field" id="tokenField">
          <label for="token">Einladungscode</label>
          <input class="input" type="text" id="token" autocomplete="off" spellcheck="false" maxlength="64" required>
          <span class="hint">Steht im Einladungslink hinter <code>token=</code>.</span>
        </div>
        <div class="field">
          <label for="username">Benutzername</label>
          <input class="input" type="text" id="username" autocomplete="username" autocapitalize="none"
                 spellcheck="false" minlength="3" maxlength="50" pattern="[a-zA-Z0-9_\-]+" required>
          <span class="hint">3–50 Zeichen: Buchstaben, Zahlen, _ und -</span>
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <div class="input-wrap">
            <input class="input" type="password" id="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            <button type="button" class="input-action" data-toggle-password aria-label="Passwort anzeigen">
              <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#eye"/></svg>
            </button>
          </div>
          <span class="hint">Mindestens 8 Zeichen</span>
        </div>
        <div class="field">
          <label for="password2">Passwort wiederholen</label>
          <input class="input" type="password" id="password2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Account erstellen</button>
      </form>

      <p class="auth-foot">Schon registriert? <a href="index.html">Anmelden</a></p>
    </div>
  </main>
  <script type="module" src="/frontend/js/register.js"></script>
</body>
</html>
