<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>movienight</title>
  <link rel="icon" href="/frontend/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/frontend/fonts/inter.css">
  <link rel="stylesheet" href="/frontend/css/base.css">
  <link rel="stylesheet" href="/frontend/css/app.css">
  <link rel="stylesheet" href="/frontend/css/swipe.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="app.html"><span class="logo-mark"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#ticket"/></svg></span><span>movie<b>night</b></span></a>
  <div class="topbar-actions">
    <a href="admin.html" class="btn btn-ghost btn-sm" id="adminLink" hidden>
      <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#shield"/></svg><span class="hide-xs">Admin</span>
    </a>
    <button class="avatar-btn" id="accountBtn" aria-label="Konto"><span class="avatar" id="avatar">?</span></button>
  </div>
</header>

<main class="app-main">
  <!-- Movies -->
  <section class="view is-active" id="viewMovies" aria-labelledby="tabMovies">
    <div id="roundHero"></div>
    <div class="toolbar" id="toolbar" hidden>
      <div class="segmented" role="radiogroup" aria-label="Sortierung">
        <button role="radio" aria-checked="true" data-sort="rank">Ranking</button>
        <button role="radio" aria-checked="false" data-sort="new">Neu</button>
        <button role="radio" aria-checked="false" data-sort="az">A–Z</button>
      </div>
      <div class="toolbar-right">
        <button class="filter-chip" id="unvotedOnly" aria-pressed="false">Unbewertet</button>
        <label class="sr-only" for="genreSelect">Genre</label>
        <select class="filter-select" id="genreSelect"><option value="">Alle Genres</option></select>
      </div>
    </div>
    <div class="movie-grid" id="movieGrid" aria-live="polite"></div>
  </section>

  <!-- Swipe -->
  <section class="view" id="viewSwipe" aria-labelledby="tabSwipe">
    <div class="swipe" id="swipe"></div>
  </section>

  <!-- Watched -->
  <section class="view" id="viewWatched" aria-labelledby="tabWatched">
    <div class="page-head">
      <h1>Gesehen</h1>
      <p id="watchedSummary">Alle bisherigen Filmabende</p>
    </div>
    <div class="watched-list" id="watchedList"></div>
  </section>
</main>

<button class="fab" id="fab" hidden>
  <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#plus"/></svg><span>Vorschlagen</span>
</button>

<nav class="tabbar" role="tablist" aria-label="Bereiche">
  <button role="tab" id="tabMovies" aria-selected="true" aria-controls="viewMovies" data-view="movies">
    <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#film"/></svg><span>Filme</span>
  </button>
  <button role="tab" id="tabSwipe" aria-selected="false" aria-controls="viewSwipe" data-view="swipe">
    <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#cards"/></svg><span>Swipe</span>
    <span class="tab-badge" id="swipeBadge" hidden></span>
  </button>
  <button role="tab" id="tabWatched" aria-selected="false" aria-controls="viewWatched" data-view="watched">
    <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#eye"/></svg><span>Gesehen</span>
  </button>
</nav>

<!-- Movie detail -->
<dialog class="sheet sheet-wide detail" id="detailDialog" aria-labelledby="detailTitle">
  <div class="sheet-inner" id="detailContent"></div>
</dialog>

<!-- Propose a movie -->
<dialog class="sheet add" id="addDialog" aria-labelledby="addTitle">
  <div class="sheet-inner">
    <div class="sheet-head">
      <span class="sheet-grip"></span>
      <button class="close-btn" id="addBack" aria-label="Zurück" hidden><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#chevron-left"/></svg></button>
      <h2 id="addTitle">Film vorschlagen</h2>
      <span class="add-quota" id="addQuota"></span>
      <button class="close-btn" data-close aria-label="Schließen"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#x"/></svg></button>
    </div>
    <div class="add-controls" id="addControls">
      <div class="segmented segmented-full" role="tablist" aria-label="Quelle" id="addTabs">
        <button role="tab" aria-selected="true" data-src="search">Suche</button>
        <button role="tab" aria-selected="false" data-src="popular">Beliebt</button>
        <button role="tab" aria-selected="false" data-src="cinema">Im Kino</button>
        <button role="tab" aria-selected="false" data-src="manual">Eigener</button>
      </div>
      <div class="input-wrap has-icon" id="searchWrap">
        <svg class="ic input-icon" aria-hidden="true"><use href="/frontend/img/icons.svg#search"/></svg>
        <input class="input" type="search" id="searchInput" placeholder="Filmtitel suchen …" autocomplete="off" enterkeyhint="search" maxlength="100">
      </div>
    </div>
    <div class="sheet-body add-body" id="addBody"></div>
  </div>
</dialog>

<!-- Account -->
<dialog class="sheet" id="accountDialog" aria-labelledby="accountTitle">
  <div class="sheet-inner">
    <div class="sheet-head">
      <span class="sheet-grip"></span>
      <h2 id="accountTitle">Konto</h2>
      <button class="close-btn" data-close aria-label="Schließen"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#x"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="account-head">
        <span class="avatar avatar-lg" id="accountAvatar">?</span>
        <div>
          <div class="account-name" id="accountName"></div>
          <div class="account-role" id="accountRole"></div>
        </div>
      </div>
      <form id="passwordForm" class="account-form" novalidate>
        <h3>Passwort ändern</h3>
        <div class="alert" id="passwordMsg" role="alert" hidden></div>
        <div class="field">
          <label for="curPassword">Aktuelles Passwort</label>
          <input class="input" type="password" id="curPassword" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="newPassword">Neues Passwort</label>
          <input class="input" type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="72" required>
          <span class="hint">Mindestens 8 Zeichen. Andere Geräte werden dabei abgemeldet.</span>
        </div>
        <button class="btn btn-block" type="submit" id="passwordBtn">
          <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#key"/></svg>Passwort speichern
        </button>
      </form>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-danger btn-block" id="logoutBtn">
        <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#logout"/></svg>Abmelden
      </button>
    </div>
  </div>
</dialog>

<script type="module" src="/frontend/js/app.js"></script>
</body>
</html>
