<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Anmelden · movienight</title>
  <link rel="icon" href="/frontend/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/frontend/fonts/inter.css">
  <link rel="stylesheet" href="/frontend/css/base.css">
</head>
<body>
  <div class="auth-poster-strip" aria-hidden="true"></div>
  <main class="auth">
    <div class="auth-card">
      <span class="logo"><span class="logo-mark"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#ticket"/></svg></span><span>movie<b>night</b></span></span>
      <h1 class="auth-title">Willkommen zurück</h1>
      <p class="auth-sub">Melde dich an und stimm für den nächsten Filmabend ab.</p>

      <div class="alert alert-error" id="error" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Benutzername</label>
          <input class="input" type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" maxlength="50" required>
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <div class="input-wrap">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="input-action" data-toggle-password aria-label="Passwort anzeigen">
              <svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#eye"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Anmelden</button>
      </form>

      <p class="auth-foot">Einladungslink bekommen? <a href="register.html">Account erstellen</a></p>
    </div>
  </main>
  <script type="module" src="/frontend/js/login.js"></script>
</body>
</html>
