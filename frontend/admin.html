<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Admin · movienight</title>
  <link rel="icon" href="/frontend/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/frontend/fonts/inter.css">
  <link rel="stylesheet" href="/frontend/css/base.css">
  <link rel="stylesheet" href="/frontend/css/admin.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="app.html"><span class="logo-mark"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#ticket"/></svg></span><span>movie<b>night</b></span></a>
  <a href="app.html" class="btn btn-ghost btn-sm"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#chevron-left"/></svg>Zur App</a>
</header>

<main class="admin">
  <div class="admin-head">
    <h1>Verwaltung</h1>
    <nav class="admin-nav" aria-label="Abschnitte">
      <a href="#rounds">Runden</a><a href="#invites">Einladungen</a><a href="#users">Nutzer</a>
    </nav>
  </div>

  <section class="panel" id="rounds" aria-labelledby="roundsTitle">
    <div class="panel-head"><h2 id="roundsTitle">Runde</h2></div>
    <div id="currentRound"></div>
    <h3 class="sub-title">Bisherige Runden</h3>
    <div class="rows" id="roundList"></div>
  </section>

  <section class="panel" id="invites" aria-labelledby="invitesTitle">
    <div class="panel-head">
      <h2 id="invitesTitle">Einladungen</h2>
      <button class="filter-toggle" id="toggleExpired" aria-pressed="false">Abgelaufene ausblenden</button>
    </div>
    <form class="invite-form" id="inviteForm">
      <div class="field"><label for="inviteType">Typ</label>
        <select class="input" id="inviteType">
          <option value="regular">Stammgast (sieht jede Runde)</option>
          <option value="guest">Gast (nur eingeladene Runden)</option>
        </select></div>
      <div class="field"><label for="inviteExpiry">Gültig</label>
        <select class="input" id="inviteExpiry">
          <option value="24">24 Stunden</option>
          <option value="72" selected>3 Tage</option>
          <option value="168">7 Tage</option>
          <option value="720">30 Tage</option>
        </select></div>
      <div class="field"><label for="inviteMaxUses">Nutzungen</label>
        <select class="input" id="inviteMaxUses">
          <option value="1" selected>Einmal</option>
          <option value="5">5×</option>
          <option value="10">10×</option>
          <option value="0">Unbegrenzt</option>
        </select></div>
      <div class="field"><label for="inviteLabel">Für wen? (optional)</label>
        <input class="input" id="inviteLabel" maxlength="100" placeholder="z. B. Max"></div>
      <button class="btn btn-primary" type="submit"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#link"/></svg>Link erstellen</button>
    </form>
    <div class="new-link" id="newLink" hidden>
      <span class="label">Neuer Link – jetzt teilen</span>
      <div class="new-link-row">
        <input class="input" id="newLinkInput" readonly aria-label="Einladungslink">
        <button class="btn" id="newLinkCopy"><svg class="ic" aria-hidden="true"><use href="/frontend/img/icons.svg#copy"/></svg>Kopieren</button>
        <button class="btn" id="newLinkShare" hidden>Teilen</button>
      </div>
    </div>
    <div class="rows" id="inviteList"></div>
  </section>

  <section class="panel" id="users" aria-labelledby="usersTitle">
    <div class="panel-head"><h2 id="usersTitle">Nutzer</h2><span class="panel-count" id="userCount"></span></div>
    <div class="rows" id="userList"></div>
  </section>
</main>

<script type="module" src="/frontend/js/admin.js"></script>
</body>
</html>
